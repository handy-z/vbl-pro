[package]
name = "focus"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3.8.6", features = ["napi4"] }
napi-derive = "3.5.5"
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_System_Threading",
  "Win32_UI_Accessibility",
  "Win32_UI_WindowsAndMessaging"
] }

[build-dependencies]
napi-build = "2.3.1"
